; SKYBOUND - game configuration

[/Script/EngineSettings.GeneralProjectSettings]
ProjectID=7C4B2E19-4A02-4C6E-9F3B-2A8D51C0E7F4
ProjectName=SKYBOUND
ProjectVersion=0.1.0
CompanyName=SKYBOUND
Description=Global-scale realistic flight simulator
Homepage=https://example.invalid/skybound
bStartInVR=False
CopyrightNotice=SKYBOUND. Third-party components listed in LICENSES_AND_ATTRIBUTION.md

[/Script/UnrealEd.ProjectPackagingSettings]
Build=IfProjectHasCode
BuildConfiguration=PPBC_Shipping
FullRebuild=False
ForDistribution=True
IncludeDebugFiles=False
UsePakFile=True
bUseIoStore=True
bCompressed=True
bShareMaterialShaderCode=True
bSharedMaterialNativeLibraries=True
+DirectoriesToAlwaysCook=(Path="/Game/Maps")
+DirectoriesToAlwaysCook=(Path="/Game/UI")
+DirectoriesToAlwaysCook=(Path="/Game/Aircraft")
+DirectoriesToNeverCook=(Path="/Game/Dev")

; Content data files that must ship outside the pak so they can be inspected,
; diffed and updated without re-cooking (spec 21, 32.11).
+DirectoriesToAlwaysStageAsNonUFS=(Path="Content/Data")

; --- Airport database -------------------------------------------------------
; The airport index is parsed on a worker thread at game-instance startup and
; the runway file is parsed on first use. DataDirectory may be overridden to
; point at a custom dataset; empty means <ProjectContent>/Data/Airports.
[SkyboundAirportSubsystem]
DataDirectory=

[/Script/SKYBOUND.SkyboundProjectSettings]
; Default sim rate is 120 Hz; users may lower it in Settings > Simulation.
DefaultSimulationHz=120
DefaultUnits=Metric
DefaultRealismLevel=Intermediate
bEnableCrashReporting=True
LogDirectory=%LOCALAPPDATA%/SKYBOUND/Logs
UserDataDirectory=%LOCALAPPDATA%/SKYBOUND
; The airport search screen must not present an empty list while the database is
; still parsing; it shows a loading state until OnDatabaseReady fires.
bPreloadAirportsAtStartup=True
