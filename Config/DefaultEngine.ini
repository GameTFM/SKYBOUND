; SKYBOUND - engine configuration
;
; Default target is MAXIMUM FIDELITY (spec 2.2). The settings here define the
; high-end experience; the in-game graphics menu lowers them per preset
; (Ultra/High/Medium/Low/Custom, spec 19) and writes to GameUserSettings.ini.
;
; Nothing here is a substitute for hardware: this file requests features; the
; engine and driver decide what is actually available.

[/Script/EngineSettings.GameMapsSettings]
GameDefaultMap=/Game/Maps/MainMenu.MainMenu
EditorStartupMap=/Game/Maps/MainMenu.MainMenu
GlobalDefaultGameMode=/Script/SKYBOUND.SkyboundGameMode

[/Script/WindowsTargetPlatform.WindowsTargetSettings]
DefaultGraphicsRHI=DefaultGraphicsRHI_DX12
bCompileAgainstEngine=True
Compiler=Default
AudioSampleRate=48000
AudioCallbackBufferFrameSize=1024

[/Script/Engine.RendererSettings]
; --- Core high-fidelity features -------------------------------------------
r.DynamicGlobalIlluminationMethod=1          ; Lumen GI
r.ReflectionMethod=1                        ; Lumen reflections
r.Lumen.HardwareRayTracing=1
r.Shadow.Virtual.Enable=1                   ; Virtual Shadow Maps
r.GenerateMeshDistanceFields=True
r.Nanite.ProjectEnabled=True
r.AntiAliasingMethod=4                      ; TSR
r.DefaultFeature.AutoExposure=True
r.DefaultFeature.MotionBlur=True
r.DefaultFeature.Bloom=True
r.SkinCache.CompileShaders=True
r.RayTracing=True
r.SupportSkyAtmosphere=True
r.SupportCloudShadows=True                  ; cloud shadows on terrain
r.SupportVolumetricFog=True
r.SupportLocalFogVolumes=True
r.SupportTranslucencyLightingVolume=True
r.VolumetricFog=True
r.VolumetricCloud=True
r.SkyAtmosphere=True
r.SupportStationarySkylight=True
r.AllowStaticLighting=False                 ; fully dynamic world (Cesium streams)

; --- World streaming / LOD -----------------------------------------------
r.Streaming.PoolSize=6000                   ; MB, high-end default
r.Streaming.LimitPoolSizeToVRAM=0
r.Streaming.HLODStrategy=2
r.ViewDistanceScale=1.0

; --- Textures / materials -------------------------------------------------
r.Streaming.MipBias=0
r.MaxAnisotropy=16
r.VT.EnableAutoImport=True
r.VT.MaxAnisotropy=16

; --- Frame pacing ---------------------------------------------------------
r.VSync=1
r.FrameRateLimit=0
t.MaxFPS=0

[/Script/Engine.PhysicsSettings]
; The aircraft does NOT use Unreal's physics for flight (spec 3.3). This is for
; props, debris and ground vehicles only.
DefaultGravityZ=-980.0
bSubstepping=True
MaxSubstepDeltaTime=0.008333
MaxSubsteps=12

[/Script/Engine.Engine]
+ActiveGameNameRedirects=(OldGameName="TP_Blank",NewGameName="/Script/SKYBOUND")
bSmoothFrameRate=True
SmoothedFrameRateRange=(LowerBound=(Type=Exclusive,Value=30),UpperBound=(Type=Inclusive,Value=144))

[/Script/CesiumRuntime.CesiumRuntimeSettings]
; Cesium ion access token is NOT stored here. It is read at runtime from the
; user's own configuration (Settings > World Data) or the CESIUM_ION_TOKEN
; environment variable, so no credential is committed to the repository.
CreditPanel=1
