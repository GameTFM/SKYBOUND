; SKYBOUND - input configuration
;
; Enhanced Input is used for gameplay mapping; these are the legacy axis
; definitions kept for compatibility and for devices that expose them directly.
; Keyboard and gamepad bindings are defaults only - everything is rebindable and
; per-device dead zones/sensitivity are stored in the user's control profile
; (spec 15). No binding here assumes a specific joystick model.

[/Script/Engine.InputSettings]
bAltEnterTogglesFullscreen=True
bUseMouseForTouch=False
bEnableMouseSmoothing=False
bEnableFOVScaling=True
DefaultViewportMouseCaptureMode=CapturePermanently_IncludingInitialMouseDown
DefaultViewportMouseLockMode=LockOnCapture
DefaultPlayerInputClass=/Script/EnhancedInput.EnhancedPlayerInput
DefaultInputComponentClass=/Script/EnhancedInput.EnhancedInputComponent

; --- Flight axes ----------------------------------------------------------
; Pitch/roll are inverted by default to match a yoke/joystick pull-back =
; nose-up convention. Rudder and throttle are direct.
+AxisMappings=(AxisName="Flight_Pitch",Scale=-1.000000,Key=S)
+AxisMappings=(AxisName="Flight_Pitch",Scale=1.000000,Key=W)
+AxisMappings=(AxisName="Flight_Roll",Scale=-1.000000,Key=A)
+AxisMappings=(AxisName="Flight_Roll",Scale=1.000000,Key=D)
+AxisMappings=(AxisName="Flight_Yaw",Scale=-1.000000,Key=Q)
+AxisMappings=(AxisName="Flight_Yaw",Scale=1.000000,Key=E)
+AxisMappings=(AxisName="Flight_Throttle",Scale=1.000000,Key=LeftShift)
+AxisMappings=(AxisName="Flight_Throttle",Scale=-1.000000,Key=LeftControl)

; Gamepad: left stick roll/pitch, right stick yaw, triggers throttle.
+AxisMappings=(AxisName="Flight_Pitch",Scale=-1.000000,Key=Gamepad_LeftY)
+AxisMappings=(AxisName="Flight_Roll",Scale=1.000000,Key=Gamepad_LeftX)
+AxisMappings=(AxisName="Flight_Yaw",Scale=1.000000,Key=Gamepad_RightX)
+AxisMappings=(AxisName="Flight_Throttle",Scale=1.000000,Key=Gamepad_RightTriggerAxis)

; --- Flight actions -------------------------------------------------------
+ActionMappings=(ActionName="ToggleGear",Key=G)
+ActionMappings=(ActionName="ToggleFlaps",Key=F)
+ActionMappings=(ActionName="ToggleSpoilers",Key=H)
+ActionMappings=(ActionName="ToggleParkingBrake",Key=SpaceBar)
+ActionMappings=(ActionName="CycleCamera",Key=C)
+ActionMappings=(ActionName="ToggleHud",Key=Tab)
+ActionMappings=(ActionName="PauseSimulation",Key=P)
